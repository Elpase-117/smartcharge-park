spring:
  application:
    name: order-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
        register-enabled: true
        health-indicator:
          enabled: true
  datasource:
    url: ${ORDER_DB_URL:jdbc:mysql://127.0.0.1:3306/order_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      read-only: false
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: smartcharge_tx_group
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: AT
  config:
    type: file
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      namespace: ""
      group: SEATA_GROUP
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
  service:
    vgroup-mapping:
      smartcharge_tx_group: default
