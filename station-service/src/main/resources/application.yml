spring:
  application:
    name: station-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
        register-enabled: true
        health-indicator:
          enabled: true
  datasource:
    url: ${STATION_DB_URL:jdbc:mysql://127.0.0.1:3306/station_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      read-only: false
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

server:
  port: ${SERVER_PORT:8082}

smartcharge:
  amap:
    web-key: ${AMAP_WEB_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
